name: CI

"on":
  push:
  pull_request:

# Least privilege: jobs only read the repository unless a job asks for more.
permissions:
  contents: read

# Cancel superseded runs of the same ref (never on main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  php:
    name: PHP ${{ matrix.php-version }} standards & tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Lint PHP (PHPCS + PHPCompatibility)
        run: composer lint

      - name: Run PHP Unit Tests
        run: composer test

  wp-integration:
    # The theme running inside REAL WordPress (core test library + MySQL):
    # theme.json as core applies it, REST routes through the real REST server,
    # wp_mail, capabilities, privacy exporters, block templates and patterns.
    # Docs: docs/07-performance-and-qa/03-testing-strategy.md §8.
    name: WordPress ${{ matrix.wp }} integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported WordPress on the oldest supported PHP.
          - wp: '6.8'
            php: '8.1'
          # The version pinned in composer.lock, on the newest PHP in the matrix.
          - wp: locked
            php: '8.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_NAME: wordpress_test
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Use WordPress ${{ matrix.wp }}
        if: matrix.wp != 'locked'
        run: >-
          composer require --dev --no-interaction --no-progress --update-with-dependencies
          "wp-phpunit/wp-phpunit:${{ matrix.wp }}.*" "roots/wordpress-no-content:${{ matrix.wp }}.*"

      - name: Run integration tests in real WordPress
        run: composer test:wp

  node:
    name: JS & CSS lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Run JS Unit Tests
        run: npm test

  e2e:
    name: Playwright E2E & visual regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build theme assets
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Visual Regression Tests
        run: npm run test:e2e

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action reads the pull request's commits through the API, which
    # needs pull-requests: read in addition to the default contents: read.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required to scan pull requests; without it the action stops with
          # "GITHUB_TOKEN is now required to scan pull requests".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Conventional Commits check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate Push commit with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose
  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          tools: composer
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Composer audit (blocking)
        run: composer audit --locked
      - name: npm audit, shipped dependencies (blocking)
        run: npm audit --omit=dev --audit-level=low
      - name: npm audit, build-tool dependencies (blocking at critical)
        run: npm audit --audit-level=critical
      - name: npm audit, build-tool dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
  package:
    name: Release zip builds and verifies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build and verify the installable zip
        run: scripts/build-release.sh
      - name: Verify unpack and PHP lint on packaged distribution
        run: |
          mkdir -p dist/unpacked
          LATEST_ZIP=$(ls -t dist/atlas-theme-*.zip | head -1)
          unzip -q -o "${LATEST_ZIP}" -d dist/unpacked/
          find dist/unpacked/ -name "*.php" -exec php -l {} +
          test -f dist/unpacked/atlas-theme/screenshot.png
          test -f dist/unpacked/atlas-theme/readme.txt
          test -f dist/unpacked/atlas-theme/style.css
          test -f dist/unpacked/atlas-theme/theme.json
          test -f dist/unpacked/atlas-theme/build/contact-form.js
          test -f dist/unpacked/atlas-theme/build/contact-form.css
          test -f dist/unpacked/atlas-theme/assets/css/interactivity.css
          test ! -d dist/unpacked/atlas-theme/src
          test -f dist/atlas-business-*.zip
          test -f dist/atlas-child-*.zip
          echo "Verified: Release zip packages are valid and production ready."
