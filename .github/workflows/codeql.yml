name: CodeQL
# Security analysis of the JavaScript (theme modules, test and build scripts)
# and of the GitHub Actions workflows themselves. CodeQL has no PHP support;
# the theme PHP is covered by PHPStan and PHPCS in ci.yml.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new CodeQL queries also run against unchanged code.
    - cron: '23 4 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload results to the repository's Code scanning alerts.
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - vendor
              - theme/build
              - dist
              - test-results
      - name: Analyze
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
